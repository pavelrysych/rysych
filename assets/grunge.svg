<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <!-- Coarse, smoky fractal noise for a subtle grunge layer over the whole site. -->
  <filter id="smoke" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".006 .014" numOctaves="4" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="gamma" amplitude="1.6" exponent="1.9" offset="-.08"/>
      <feFuncG type="gamma" amplitude="1.6" exponent="1.9" offset="-.08"/>
      <feFuncB type="gamma" amplitude="1.6" exponent="1.9" offset="-.08"/>
    </feComponentTransfer>
  </filter>
  <rect width="900" height="900" filter="url(#smoke)"/>
</svg>
