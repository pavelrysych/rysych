      <text x="304" y="225" font-size="38" font-weight="700" fill="#f4faf6">$29,034.87</text>
      <text x="304" y="257" font-size="12" fill="#a7cabc">↗ 12.8% vs. prior month</text>
      <g fill="#8ed4b1">
        <rect x="575" y="239" width="12" height="27" rx="3"/><rect x="595" y="224" width="12" height="42" rx="3"/><rect x="615" y="246" width="12" height="20" rx="3"/><rect x="635" y="208" width="12" height="58" rx="3"/>
      </g>
