      <text x="48" y="286" fill="#b5d0c3">Analytics</text>
      <text x="48" y="332" fill="#b5d0c3">Donations</text>
      <text x="48" y="378" fill="#b5d0c3">Recurring gifts</text>
      <text x="48" y="424" fill="#b5d0c3">Supporters</text>
