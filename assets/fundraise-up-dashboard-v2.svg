<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Fundraise Up impact overview dashboard</title>
  <desc id="desc">A dark teal and mint fundraising analytics dashboard with campaign metrics, donation trend, recent donors and campaign health.</desc>
  <rect width="1600" height="1000" fill="#edf4ef"/>
  <rect x="0" y="0" width="236" height="1000" fill="#0d3837"/>
  <rect x="236" y="0" width="1364" height="1000" fill="#edf4ef"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#f4faf6">
