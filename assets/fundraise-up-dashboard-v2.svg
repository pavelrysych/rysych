    <g font-size="11" fill="#8ca29a"><text x="322" y="617">W1</text><text x="428" y="617">W2</text><text x="534" y="617">W3</text><text x="640" y="617">W4</text><text x="746" y="617">W5</text><text x="852" y="617">W6</text><text x="958" y="617">W7</text><text x="1064" y="617">W8</text></g>
    <path d="M324 530 L430 492 L536 507 L642 454 L748 476 L854 420 L960 447 L1068 385 L1068 568 L324 568 Z" fill="#dff1e8"/>
    <path d="M324 530 L430 492 L536 507 L642 454 L748 476 L854 420 L960 447 L1068 385" fill="none" stroke="#3d9e80" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1068" cy="385" r="7" fill="#0d3837"/>
    <rect x="1000" y="360" width="76" height="31" rx="8" fill="#0d3837"/>
    <text x="1015" y="380" font-size="11" fill="#f4faf6">$29.0k</text>

