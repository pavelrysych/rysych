    <text x="38" y="82" font-size="11" fill="#9dc1b0" letter-spacing="1.5">IMPACT WORKSPACE</text>
    <rect x="24" y="103" width="188" height="48" rx="10" fill="#164b49"/>
    <circle cx="47" cy="127" r="7" fill="#b7e6c7"/>
    <text x="66" y="132" font-size="13" font-weight="600">New wells in Africa</text>
    <text x="38" y="190" font-size="10" fill="#9dc1b0" letter-spacing="2">NAVIGATION</text>
