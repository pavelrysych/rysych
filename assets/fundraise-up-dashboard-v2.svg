    <text x="1178" y="574" font-size="12" fill="#52766d">Goal progress</text><text x="1425" y="574" font-size="12" fill="#245e55">$31,500 target</text>

    <rect x="278" y="680" width="850" height="258" rx="18" fill="#ffffff" stroke="#dce8e1"/>
    <text x="308" y="722" font-size="19" font-weight="700">Recent donors</text>
    <text x="308" y="747" font-size="12" fill="#6f8580">Latest activity across this campaign</text>
    <g font-size="13" fill="#29423f">
      <text x="308" y="790" fill="#8ca29a">DONOR</text><text x="730" y="790" fill="#8ca29a">AMOUNT</text><text x="900" y="790" fill="#8ca29a">STATUS</text>
      <line x1="308" y1="806" x2="1095" y2="806" stroke="#dfeae3"/>
      <text x="308" y="838">Angela Ellis</text><text x="730" y="838">$400</text><text x="900" y="838" fill="#3d9e80">Completed</text>
      <text x="308" y="875">Chris Bernang</text><text x="730" y="875">$70</text><text x="900" y="875" fill="#3d9e80">Completed</text>
      <text x="308" y="912">Max Rocks</text><text x="730" y="912">$10</text><text x="900" y="912" fill="#c58d4c">Recurring</text>
