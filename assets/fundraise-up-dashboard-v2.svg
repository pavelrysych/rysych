    <rect x="1148" y="680" width="380" height="258" rx="18" fill="#0d3837"/>
    <text x="1178" y="722" font-size="19" font-weight="700" fill="#f4faf6">Giving mix</text>
    <text x="1178" y="748" font-size="12" fill="#a7cabc">One-time and recurring support</text>
    <circle cx="1280" cy="835" r="66" fill="none" stroke="#8ed4b1" stroke-width="23" stroke-dasharray="245 170" transform="rotate(-90 1280 835)"/>
    <circle cx="1280" cy="835" r="66" fill="none" stroke="#e3a2a9" stroke-width="23" stroke-dasharray="170 245" stroke-dashoffset="-245" transform="rotate(-90 1280 835)"/>
    <text x="1255" y="830" font-size="23" font-weight="700" fill="#f4faf6">63%</text><text x="1250" y="851" font-size="11" fill="#a7cabc">one-time</text>
    <text x="1385" y="810" font-size="12" fill="#a7cabc">One-time</text><text x="1385" y="834" font-size="12" fill="#f4faf6">$18.3k</text><text x="1385" y="875" font-size="12" fill="#a7cabc">Recurring</text><text x="1385" y="899" font-size="12" fill="#f4faf6">$10.7k</text>
