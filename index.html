    <script>
      (() => {
        const root = document.documentElement;
        root.classList.add('is-loading');

        const reveal = async () => {
          const photo = document.querySelector('.portrait-photo');
          try {
            if (photo && typeof photo.decode === 'function') await photo.decode();
          } catch {
            // Keep the preview visible if the full photo cannot be decoded.
          }
          if (!photo || !photo.naturalWidth) root.classList.add('photo-unavailable');

          // Paint the blurred state even when the photo comes from the cache.
          requestAnimationFrame(() => {
            requestAnimationFrame(() => root.classList.remove('is-loading'));
          });
        };

        if (document.readyState === 'complete') reveal();
        else window.addEventListener('load', reveal, { once: true });
      })();
    </script>
